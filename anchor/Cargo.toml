# Why: makes oracle and perp one Rust workspace so they build together and
#      share one target/ folder and one lock file.
# How: every folder in programs/ is a member; the release profile keeps
#      overflow checks on (important for money maths) and optimises for size.

[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
