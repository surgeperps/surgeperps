# Why: tells Cargo how to build the `perp` program and which crates it uses.
# How: depends on anchor-lang and on the oracle crate (cpi feature) to read the Oracle account type; the features are Anchor's standard build switches.

[package]
name = "perp"
version = "0.1.0"
description = "Surge perp program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "perp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "oracle/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
oracle = { path = "../oracle", features = ["cpi"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
