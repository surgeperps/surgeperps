# Why: catches broken code before it is merged: a keeper that doesn't typecheck
#      or a program that fails its tests.
# How: GitHub Actions runs these jobs on every push and pull request.
#      The keeper job runs now; the Anchor job is left commented out until the
#      programs have real tests.

name: CI

on:
  push:
  pull_request:

jobs:
  keeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npm run typecheck

